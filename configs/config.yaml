# ── Mode switch ──────────────────────────────────────────────────────────────
# "cnn_rnn"  → trains your custom model then evaluates it
# "vit_gpt2" → skips training, evaluates the pre-trained ViT-GPT2 model
mode: "vit_gpt2"

# ── ViT-GPT2 settings (only used when mode: "vit_gpt2") ─────────────────────
vit_gpt2:
  model_id: "nlpconnect/vit-gpt2-image-captioning"
  max_length: 16
  num_beams: 4
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  eval_samples: 300   # number of test-set images to evaluate

dataset:
  name: "MS-COCO-2014"
  url_annotations: "http://images.cocodataset.org/annotations/annotations_trainval2014.zip"
  image_dir: "data/train2014"
  caption_file: "data/annotations/captions_train2014.json"
  image_prefix: "COCO_train2014_"
  vocab_size: 10000
  max_caption_length: 25
  subset_size: 0  # Set to 0 to use the full dataset,

model:
  encoder_name: "Xception"
  decoder_type: "LSTM"
  num_layers: 3
  units: 512
  embedding_dim: 256
  attention_type: "scaled_dot"

training:
  epochs: 50                 # Optimized for your remaining units
  batch_size: 256            # Safer for 3-layers on L4
  learning_rate: 0.0004
  use_teacher_forcing: True 
  optimizer_type: "greywolf" # Metaheuristic winner
  checkpoint_path: "/content/drive/MyDrive/Image_Captioning_Models/checkpoints/"

mlflow:
  tracking_uri: "https://dagshub.com/enesdemir0/image-captioning-pro.mlflow"
  repo_owner: "enesdemir0"
  repo_name: "image-captioning-pro"