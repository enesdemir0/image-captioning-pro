dataset:
  name: "MS-COCO-2017"
  url_annotations: "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
  
  # THESE ARE THE PATHS FOR THE AWSAF DATASET
  image_dir: "/kaggle/input/coco-2017-dataset/train2017"
  caption_file: "/kaggle/input/coco-2017-dataset/annotations/captions_train2017.json"
  
  image_prefix: "" # 2017 uses NO prefix
  vocab_size: 10000
  max_caption_length: 25
  subset_size: 50000

model:
  encoder_name: "InceptionV3"
  decoder_type: "GRU"
  num_layers: 3
  units: 512
  embedding_dim: 256

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.0005
  use_teacher_forcing: False 
  checkpoint_path: "/kaggle/working/checkpoints/"

mlflow:
  tracking_uri: "https://dagshub.com/enesdemir0/image-captioning-pro.mlflow"
  repo_owner: "enesdemir0"
  repo_name: "image-captioning-pro"